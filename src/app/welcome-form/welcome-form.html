<h1 class="question">Antes de começar, como podemos te chamar?</h1>

<div class="flex flex-col gap-3">
  <input
    class="text-input"
    placeholder="Seu nome"
    [ngModel]="flow.answers().clienteNome"
    (ngModelChange)="onNomeChange($event)"
  />
  <input
    class="text-input"
    placeholder="Seu WhatsApp"
    inputmode="tel"
    [ngModel]="flow.answers().clienteWhatsapp"
    (ngModelChange)="onWhatsappChange($event)"
  />
</div>

<button type="button" class="primary-btn mt-5" [disabled]="!podeContinuar()" (click)="continuar()">
  Continuar
  <app-icon name="arrow-right" [size]="18" />
</button>

<div
  class="lock-wrap"
  [class.lock-wrap-exit]="unlocking()"
  (click)="onUnlock()"
  role="button"
  tabindex="0"
  (keydown)="onKeydown($event)"
  aria-label="Toque na tela para iniciar a pesquisa"
>
  <video
    class="lock-video"
    [src]="videoSrc"
    [autoplay]="true"
    [loop]="true"
    [muted]="true"
    playsinline
    disablepictureinpicture
  ></video>
  <div class="lock-video-overlay"></div>

  <div class="lock-inner" [class.lock-inner-exit]="unlocking()">
    <span class="lock-cta-btn">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2" />
        <path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2" />
        <path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8" />
        <path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15" />
      </svg>
      Toque para começar
    </span>
    <p class="lock-sub">e avalie seu atendimento</p>

    <!-- Link direto: sai da pesquisa e abre o BarberPoint no próprio tablet -->
    <a class="lock-points-btn" [href]="barberPointUrl" (click)="$event.stopPropagation()" (keydown)="$event.stopPropagation()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
      </svg>
      Verifique seus pontos do BarberPoint
    </a>
  </div>
</div>

<div class="flex flex-col items-center text-center">
  <div class="thanks-ring">
    <div class="thanks-circle">
      <app-icon name="check" [size]="30" [strokeWidth]="3" />
    </div>
  </div>
  <h1 class="question text-center mt-6">Obrigado pela sua avaliação!</h1>
  <p class="offer-text text-center">Sua opinião ajuda o Boleiro a melhorar cada vez mais.</p>

  <div class="flex flex-col items-center gap-3 w-full mt-6">
    <p class="offer-text text-center">
      Adorou o atendimento? Deixe também uma avaliação pra gente no Google!
    </p>

    <div class="nfc-hint">
      <span class="nfc-hint-icon" aria-hidden="true">
        <svg width="52" height="52" viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <!-- celular -->
          <rect x="6" y="9" width="20" height="34" rx="5" />
          <path d="M14 14h4" />
          <circle cx="16" cy="38" r="1.2" fill="currentColor" stroke="none" />
          <!-- ondas de aproximação (contactless) -->
          <path class="nfc-wave nfc-wave-1" d="M32 20a9.5 9.5 0 0 1 0 12" />
          <path class="nfc-wave nfc-wave-2" d="M37.5 15a17 17 0 0 1 0 22" />
          <path class="nfc-wave nfc-wave-3" d="M43 10a24.5 24.5 0 0 1 0 32" />
        </svg>
      </span>
      <span class="nfc-hint-text">Aproxime o celular da etiqueta no topo do tablet</span>
    </div>

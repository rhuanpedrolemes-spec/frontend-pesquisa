<div class="admin-overlay" (click)="onOverlayClick($event)">
  <div class="admin-panel">
    <div class="admin-panel-header">
      <span class="admin-title">{{ authed() ? 'Respostas dos clientes' : 'Área restrita' }}</span>
      <button type="button" class="admin-close" (click)="fechar()">✕</button>
    </div>

    @if (!authed()) {
      <app-pin-pad [value]="pinInput()" [error]="pinError()" (digit)="onDigit($event)" (delete)="onDelete()" />
    } @else {
      <app-admin-list [loading]="loading()" [resumo]="resumo()" [respostas]="respostas()" />
    }
  </div>
</div>

<div class="flex flex-col gap-3">
  @for (option of options; track option) {
    <button type="button" class="choice-btn" [attr.data-selected]="option === selected" (click)="onChoose(option)">
      <span>{{ option }}</span>
      <span class="choice-check" [attr.data-selected]="option === selected">
        <app-icon name="check" [size]="14" [strokeWidth]="3" />
      </span>
    </button>
  }
</div>

<span class="stars" role="img" [attr.aria-label]="(value ?? 0) + ' de 5 estrelas'">
  <span class="stars-row stars-empty">
    @for (i of estrelas; track i) {
      <svg [attr.width]="size" [attr.height]="size" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
      </svg>
    }
  </span>
  <span class="stars-row stars-fill" [style.width.%]="percentual">
    @for (i of estrelas; track i) {
      <svg [attr.width]="size" [attr.height]="size" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z" />
      </svg>
    }
  </span>
</span>

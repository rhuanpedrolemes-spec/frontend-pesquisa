<svg
  width="24"
  height="24"
  viewBox="0 0 24 24"
  [attr.width]="size"
  [attr.height]="size"
  [style.opacity]="selected ? 1 : 0.85"
  [style.transform]="selected ? 'scale(1.08)' : 'scale(1)'"
>
  <circle cx="12" cy="12" r="10" [attr.fill]="fill" [attr.stroke]="color" [attr.stroke-width]="strokeWidth" />
  <circle cx="8.5" cy="10" r="1.15" [attr.fill]="color" stroke="none" />
  <circle cx="15.5" cy="10" r="1.15" [attr.fill]="color" stroke="none" />

  @switch (kind) {
    @case ('angry') {
      <path d="M8 16.5c1-1.5 2.5-2 4-2s3 .5 4 2" [attr.stroke]="color" [attr.stroke-width]="strokeWidth" fill="none" stroke-linecap="round" />
    }
    @case ('frown') {
      <path d="M8 16c1-1.3 2.5-2 4-2s3 .7 4 2" [attr.stroke]="color" [attr.stroke-width]="strokeWidth" fill="none" stroke-linecap="round" />
    }
    @case ('meh') {
      <line x1="8" y1="15.5" x2="16" y2="15.5" [attr.stroke]="color" [attr.stroke-width]="strokeWidth" stroke-linecap="round" />
    }
    @case ('smile') {
      <path d="M8 14c1 1.3 2.5 2 4 2s3-.7 4-2" [attr.stroke]="color" [attr.stroke-width]="strokeWidth" fill="none" stroke-linecap="round" />
    }
    @case ('laugh') {
      <path d="M7 13.5c1.2 2 3 3 5 3s3.8-1 5-3" [attr.stroke]="color" [attr.stroke-width]="strokeWidth" fill="none" stroke-linecap="round" />
      <path d="M9 15.3c.8.5 1.9.8 3 .8s2.2-.3 3-.8" stroke="none" [attr.fill]="color" opacity="0.35" />
    }
  }
</svg>

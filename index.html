/* ------------------------------------------------------------------ */
/* Cliente da API (substitui o antigo storage baseado em localStorage) */
/* Depois que o backend estiver publicado no Render, troque a URL      */
/* abaixo pela URL real gerada (ex.: https://tradicao-boleiro.onrender.com) */
/* e faça o commit para a Vercel republicar o frontend automaticamente. */
/* ------------------------------------------------------------------ */

const API_BASE_URL = "https://SUBSTITUIR.onrender.com";
const RESPOSTAS_URL = `${API_BASE_URL}/api/respostas`;

const api = {
  async criarResposta(respostas) {
    const res = await fetch(RESPOSTAS_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(respostas),
    });
    if (!res.ok) throw new Error("Falha ao salvar resposta: " + res.status);
    return res.json();
  },
  async listarRespostas(pin) {
    const res = await fetch(RESPOSTAS_URL, {
      headers: { "x-admin-pin": pin },
    });
    if (res.status === 401) {
      const erro = new Error("PIN inválido");
      erro.unauthorized = true;
      throw erro;
    }
    if (!res.ok) throw new Error("Falha ao listar respostas: " + res.status);
    return res.json();
  },
};

/* Fluxo condicional                                                   */

function computeFlow(a) {
  const flow = ["atendimento", "assinante"];
  if (a.assinante === true) {
    flow.push("sat_assinatura", "sat_geral", "comentario");
  } else if (a.assinante === false) {
    flow.push("frequencia");
    if (a.frequenciaCorte === "1 vez") {
      flow.push("objecao");
      if (a.objecao === "Sairia muito caro") {
        flow.push("oferta");
      }
    } else if (
      a.frequenciaCorte === "2 vezes" ||
      a.frequenciaCorte === "3 vezes" ||
      a.frequenciaCorte === "4 vezes ou mais"
    ) {
      flow.push("oferta");
    }
    if (a.interessePlano === "Sim") {
      flow.push("oferta_confirmacao");
    }
    flow.push("sat_geral", "comentario");
  }
  return flow;
}

/* ------------------------------------------------------------------ */
/* Escala de rostinhos 1-10 (bravo -> triste -> feliz)                 */
/* ------------------------------------------------------------------ */

const FACE_STAGES = [
  { max: 2, Icon: IconAngry, color: "#e2554c" },
  { max: 4, Icon: IconFrown, color: "#e2833f" },
  { max: 6, Icon: IconMeh, color: "#dfae3a" },
  { max: 8, Icon: IconSmile, color: "#8dc25a" },
  { max: 10, Icon: IconLaugh, color: "#92a243" },
];

function faceFor(n) {
  return FACE_STAGES.find((s) => n <= s.max) || FACE_STAGES[FACE_STAGES.length - 1];
}

function FaceScaleInput({ value, onSelect }) {
  const nums = Array.from({ length: 10 }, (_, i) => i + 1);
  return (
    <div>
      <div className="grid grid-cols-5 gap-2">
        {nums.map((n) => {
          const selected = value === n;
          const { Icon, color } = faceFor(n);
          return (
            <button
              key={n}
              onClick={() => onSelect(n)}
              className="face-cell"
              style={{
                background: selected ? `${color}22` : `${color}0d`,
                borderColor: selected ? color : `${color}33`,
              }}
            >
              <Icon
                size={24}
                strokeWidth={selected ? 2.4 : 2}
                color={color}
                fill={selected ? `${color}33` : "transparent"}
                style={{
                  opacity: selected ? 1 : 0.85,
                  transform: selected ? "scale(1.08)" : "scale(1)",
                  transition: "all .18s ease",
                }}
              />
              <span
                className="scale-num"
                style={{
                  color: color,
                  fontWeight: selected ? 800 : 600,
                  opacity: selected ? 1 : 0.85,
                }}
              >
                {n}
              </span>
            </button>
          );
        })}
      </div>
      <div className="flex justify-between mt-3 px-1">
        <span className="scale-label">Insatisfeito</span>
        <span className="scale-label">Satisfeito</span>
      </div>
    </div>
  );
}

function PinPad({ value, error, onDigit, onDelete }) {
  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"];
  return (
    <div className="pin-wrap">
      <p className="pin-label">Digite o PIN de acesso</p>
      <div className="pin-dots">
        {[0, 1, 2, 3].map((i) => (
          <span
            key={i}
            className={`pin-dot ${i < value.length ? "pin-dot-filled" : ""} ${
              error ? "pin-dot-error" : ""
            }`}
          />
        ))}
      </div>
      <div className="pin-grid">
        {keys.map((k, idx) =>
          k === "" ? (
            <div key={idx} />
          ) : k === "del" ? (
            <button key={idx} className="pin-key pin-key-del" onClick={onDelete}>
              ⌫
            </button>
          ) : (
            <button key={idx} className="pin-key" onClick={() => onDigit(k)}>
              {k}
            </button>
          )
        )}
      </div>
    </div>
  );
}

function ScoreChip({ label, value }) {
  const { color } = faceFor(value);
  return (
    <div className="score-chip" style={{ borderColor: color, color }}>
      <span className="score-chip-value">{value}</span>
      <span className="score-chip-label">{label}</span>
    </div>
  );
}

function AdminList({ loading, data }) {
  if (loading) return <p className="admin-empty">Carregando respostas...</p>;
  if (!data || data.length === 0) {
    return <p className="admin-empty">Nenhuma resposta ainda.</p>;
  }

  const avg = (field) => {
    const vals = data
      .map((d) => d[field])
      .filter((v) => typeof v === "number");
    if (!vals.length) return null;
    return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
  };
  const avgAtendimento = avg("notaAtendimento");
  const avgGeral = avg("satisfacaoGeral");

  return (
    <div className="admin-list-wrap">
      <div className="admin-summary">
        <div className="admin-summary-item">
          <span className="admin-summary-num">{data.length}</span>
          <span className="admin-summary-label">Respostas</span>
        </div>
        {avgAtendimento && (
          <div className="admin-summary-item">
            <span className="admin-summary-num">{avgAtendimento}</span>
            <span className="admin-summary-label">Média atend.</span>
          </div>
        )}
        {avgGeral && (
          <div className="admin-summary-item">
            <span className="admin-summary-num">{avgGeral}</span>
            <span className="admin-summary-label">Média geral</span>
          </div>
        )}
      </div>

      <div className="admin-list">
        {data.map((r, i) => (
          <div key={i} className="admin-card">
            <div className="admin-card-top">
              <span className="admin-card-date">
                {r.criadoEm
                  ? new Date(r.criadoEm).toLocaleString("pt-BR", {
                      day: "2-digit",
                      month: "2-digit",
                      hour: "2-digit",
                      minute: "2-digit",
                    })
                  : ""}
              </span>
              <span
                className="admin-card-badge"
                data-type={r.assinante ? "assinante" : "novo"}
              >
                {r.assinante ? "Assinante" : "Não assinante"}
              </span>
            </div>

            <div className="admin-card-scores">
              {r.notaAtendimento != null && (
                <ScoreChip label="Atendimento" value={r.notaAtendimento} />
              )}
              {r.satisfacaoAssinatura != null && (
                <ScoreChip label="Assinatura" value={r.satisfacaoAssinatura} />
              )}
              {r.satisfacaoGeral != null && (
                <ScoreChip label="Geral" value={r.satisfacaoGeral} />
              )}
            </div>

            {r.frequenciaCorte && (
              <p className="admin-card-line">
                <b>Frequência:</b> {r.frequenciaCorte}
              </p>
            )}
            {r.objecao && (
              <p className="admin-card-line">
                <b>Objeção:</b> {r.objecao}
              </p>
            )}
            {r.interessePlano && (
              <p className="admin-card-line">
                <b>Interesse no plano:</b> {r.interessePlano}
              </p>
            )}
            {r.comentario && (
              <p className="admin-card-line">
                <b>Comentário:</b> {r.comentario}
              </p>
            )}
            {r.indicacaoNome && (
              <p className="admin-card-line">
                <b>Indicação:</b> {r.indicacaoNome}
                {r.indicacaoWhatsapp ? ` — ${r.indicacaoWhatsapp}` : ""}
              </p>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function BarberPointSurvey() {
  const [answers, setAnswers] = useState(emptyAnswers);
  const [stepIndex, setStepIndex] = useState(0);
  const [stage, setStage] = useState("lock"); // lock | survey | referral | thanks
  const [unlocking, setUnlocking] = useState(false);
  const [animKey, setAnimKey] = useState(0);
  const savedRef = useRef(false);

  const [adminOpen, setAdminOpen] = useState(false);
  const [adminAuthed, setAdminAuthed] = useState(false);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [adminData, setAdminData] = useState(null);
  const [adminLoading, setAdminLoading] = useState(false);
  const pressTimerRef = useRef(null);

  const flow = computeFlow(answers);
  const screenId = flow[stepIndex];

  function handleUnlock() {
    if (unlocking) return;
    setUnlocking(true);
    setTimeout(() => {
      setAnimKey((k) => k + 1);
      setStage("survey");
      setUnlocking(false);
    }, 420);
  }

  function startLogoPress() {
    pressTimerRef.current = setTimeout(() => {
      setAdminOpen(true);
    }, 900);
  }
  function endLogoPress() {
    if (pressTimerRef.current) {
      clearTimeout(pressTimerRef.current);
      pressTimerRef.current = null;
    }
  }

  function closeAdmin() {
    setAdminOpen(false);
    setAdminAuthed(false);
    setPinInput("");
    setPinError(false);
    setAdminData(null);
  }

  function handlePinDigit(d) {
    if (pinInput.length >= 4) return;
    const next = pinInput + d;
    setPinInput(next);
    setPinError(false);
    if (next.length === 4) {
      setAdminLoading(true);
      (async () => {
        try {
          const respostas = await api.listarRespostas(next);
          const ordenadas = [...respostas].sort(
            (a, b) => new Date(b.criadoEm) - new Date(a.criadoEm)
          );
          setAdminData(ordenadas);
          setAdminAuthed(true);
        } catch (e) {
          setPinError(true);
          setTimeout(() => {
            setPinInput("");
            setPinError(false);
          }, 500);
          if (!e.unauthorized) console.error("Falha ao carregar respostas:", e);
        } finally {
          setAdminLoading(false);
        }
      })();
    }

        }
        .admin-close:hover { color: var(--text); }

        .pin-wrap {
          padding: 30px 24px 28px;
          display: flex;
          flex-direction: column;
          align-items: center;
        }
        .pin-label {
          font-size: 13px;
          color: var(--text-muted);
          margin-bottom: 20px;
          font-weight: 600;
        }
        .pin-dots {
          display: flex;
          gap: 12px;
          margin-bottom: 28px;
        }
        .pin-dot {
          width: 12px;
          height: 12px;
          border-radius: 50%;
          border: 1.5px solid rgba(255,255,255,0.25);
          background: transparent;
          transition: all .15s ease;
        }
        .pin-dot-filled { background: var(--green-bright); border-color: var(--green-bright); }
        .pin-dot-error { border-color: #e2554c !important; background: #e2554c !important; }
        .pin-grid {
          display: grid;
          grid-template-columns: repeat(3, 1fr);
          gap: 12px;
          width: 100%;
          max-width: 230px;
        }
        .pin-key {
          height: 54px;
          border-radius: 14px;
          background: rgba(255,255,255,0.04);
          border: 1px solid rgba(255,255,255,0.08);
          color: var(--text);
          font-size: 18px;
          font-weight: 700;
        }
        .pin-key:hover { background: var(--green-soft); border-color: var(--green-bright); }
        .pin-key-del { font-size: 16px; color: var(--text-muted); }

        .admin-list-wrap {
          overflow-y: auto;
          padding: 16px 20px 22px;
        }
        .admin-summary {
          display: flex;
          gap: 10px;
          margin-bottom: 16px;
        }
        .admin-summary-item {
          flex: 1;
          background: rgba(255,255,255,0.03);
          border: 1px solid rgba(255,255,255,0.07);
          border-radius: 14px;
          padding: 10px 6px;
          text-align: center;
        }
        .admin-summary-num {
          display: block;
          font-family: 'Bebas Neue', sans-serif;
          font-size: 23px;
          color: var(--green-bright);
          letter-spacing: 0.5px;
        }
        .admin-summary-label {
          font-size: 9.5px;
          color: var(--text-muted);
          text-transform: uppercase;
          letter-spacing: 0.5px;
          font-weight: 700;
        }
        .admin-empty {
          padding: 44px 20px;
          text-align: center;
          color: var(--text-muted);
          font-size: 14px;
        }
        .admin-list {
          display: flex;
          flex-direction: column;
          gap: 12px;
        }
        .admin-card {
          background: rgba(255,255,255,0.03);
          border: 1px solid rgba(255,255,255,0.07);
          border-radius: 16px;
          padding: 14px 16px;
        }
        .admin-card-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 10px;
        }
        .admin-card-date {
          font-size: 11px;
          color: var(--text-muted);
          font-weight: 600;
        }
        .admin-card-badge {
          font-size: 10px;
          font-weight: 700;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          padding: 3px 9px;
          border-radius: 999px;
          border: 1px solid var(--green-bright);
          color: var(--green-bright);
        }
        .admin-card-badge[data-type="novo"] {
          border-color: rgba(255,255,255,0.2);
          color: var(--text-muted);
        }
        .admin-card-scores {
          display: flex;
          gap: 8px;
          margin-bottom: 8px;
          flex-wrap: wrap;
        }
        .score-chip {
          display: flex;
          align-items: baseline;
          gap: 5px;
          border: 1.5px solid;
          border-radius: 10px;
          padding: 4px 9px;
        }
        .score-chip-value { font-weight: 800; font-size: 14px; }
        .score-chip-label {
          font-size: 10px;
          color: var(--text-muted);
          text-transform: uppercase;
          letter-spacing: 0.3px;
        }
        .admin-card-line {
          font-size: 12.5px;
          color: var(--text-muted);
          line-height: 1.5;
          margin-top: 2px;
        }
        .admin-card-line b { color: var(--text); font-weight: 700; }

        @media (prefers-reduced-motion: reduce) {
          .screen-enter, .thanks-circle, .thanks-ring::before { animation: none !important; }
        }
      `}</style>

      <div className="w-full flex flex-col items-center" style={{ position: "relative" }}>
        <Header
          step={stepIndex + 1}
          total={flow.length}
          showProgress={showProgress}
          onLogoPressStart={startLogoPress}
          onLogoPressEnd={endLogoPress}
        />
        <div className="bp-card">
          <div key={animKey} className="screen-enter">
            {content}
          </div>
        </div>

        {stage === "lock" && (
          <LockScreen unlocking={unlocking} onUnlock={handleUnlock} />
        )}

        {adminOpen && (
          <div
            className="admin-overlay"
            onClick={(e) => {
              if (e.target === e.currentTarget) closeAdmin();
            }}
          >
            <div className="admin-panel">
              <div className="admin-panel-header">
                <span className="admin-title">
                  {adminAuthed ? "Respostas dos clientes" : "Área restrita"}
                </span>
                <button className="admin-close" onClick={closeAdmin}>
                  ✕
                </button>
              </div>
              {!adminAuthed ? (
                <PinPad
                  value={pinInput}
                  error={pinError}
                  onDigit={handlePinDigit}
                  onDelete={handlePinDelete}
                />
              ) : (
                <AdminList loading={adminLoading} data={adminData} />
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<BarberPointSurvey />);
</script>
</body>
</html>
